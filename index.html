<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : le feutre passe sous l'encoche et la barre d'accueil. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <!-- Doit suivre --bg de theme.css : c'est la teinte de la barre d'état une fois
         l'application installée sur l'écran d'accueil. -->
    <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vachette" />
    <meta name="description" content="Vachette — compteur de points pour le tarot à 3, 4 et 5 joueurs." />
    <link rel="icon" type="image/svg+xml" href="/tarot/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/tarot/icons/apple-touch-icon.png" />
    <title>Vachette</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
